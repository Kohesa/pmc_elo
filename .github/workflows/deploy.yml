name: Deploy Supabase

on:
  push:
    branches:
      - homolog
      - master
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar Supabase
    runs-on: ubuntu-latest
    if: github.ref_name == 'master' || github.ref_name == 'homolog'
    environment: ${{ github.ref_name == 'master' && 'production' || 'homolog' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar configuracao do ambiente
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Secret SUPABASE_ACCESS_TOKEN nao configurado."; exit 1; }
          test -n "$SUPABASE_PROJECT_ID" || { echo "Secret SUPABASE_PROJECT_ID nao configurado."; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Secret SUPABASE_DB_PASSWORD nao configurado."; exit 1; }

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Vincular projeto Supabase
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Aplicar migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Verificar alteracoes em Edge Functions
        id: functions
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$before" "${{ github.sha }}" -- supabase/functions supabase/config.toml | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar Edge Functions
        if: steps.functions.outputs.changed == 'true'
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID" --use-api
